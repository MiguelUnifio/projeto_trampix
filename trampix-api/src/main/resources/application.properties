spring.application.name=trampix-api

# conexão com o MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/trampix?createDatabaseIfNotExist=true&serverTimezone=America/Sao_Paulo}
# usuário e senha do MySQL
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# cria e atualiza as tabelas
spring.jpa.hibernate.ddl-auto=update

# mostra o SQL no console
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# mensagens em português
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed

# segredo do token JWT
trampix.jwt.segredo=${TRAMPIX_JWT_SEGREDO:dev-somente-local-gS5uh93rSqNDvLzdXgF5ZjkQIqSGOB3WQSu3kwxIIJpbUVvrbGQwVlaA}
# validade do token
trampix.jwt.expiracao=2h

# origens liberadas no CORS
# várias origens separadas por vírgula (ex.: http://localhost:4200,https://meu-front.netlify.app)
trampix.cors.origens=${TRAMPIX_CORS_ORIGENS:http://localhost:4200,https://projeto-trampix.vercel.app}

# e-mail e senha do ADMIN inicial
trampix.admin.email=${TRAMPIX_ADMIN_EMAIL:}
trampix.admin.senha=${TRAMPIX_ADMIN_SENHA:}

# Usuários HTTP Basic de demonstração para a avaliação (substitua por variáveis de ambiente em produção)
trampix.basic.admin.usuario=${TRAMPIX_BASIC_ADMIN_USUARIO:admin@trampix.local}
trampix.basic.admin.senha=${TRAMPIX_BASIC_ADMIN_SENHA:AdminTrampix123!}
trampix.basic.usuario.usuario=${TRAMPIX_BASIC_USUARIO:usuario@trampix.local}
trampix.basic.usuario.senha=${TRAMPIX_BASIC_USUARIO_SENHA:UsuarioTrampix123!}
